name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 还原依赖
        run: dotnet restore EmbyChapterImageFixer/EmbyChapterImageFixer.csproj

      - name: 构建插件
        run: |
          dotnet build EmbyChapterImageFixer/EmbyChapterImageFixer.csproj \
            -c Release --no-restore

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: EmbyChapterImageFixer
          path: EmbyChapterImageFixer/bin/Release/EmbyChapterImageFixer.dll
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 构建发布版
        run: dotnet build EmbyChapterImageFixer/EmbyChapterImageFixer.csproj -c Release

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: EmbyChapterImageFixer/bin/Release/EmbyChapterImageFixer.dll
          generate_release_notes: true
